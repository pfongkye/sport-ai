# Cloud Build config for the SportAI app image (amd64/linux for Cloud Run).
#
# Invoked by 04_deploy_app_cloudrun.sh:
#   gcloud builds submit --config deploy/gcp/cloudbuild.yaml \
#     --substitutions=_IMAGE=...,_NEXT_PUBLIC_SUPABASE_URL=...,_NEXT_PUBLIC_SUPABASE_ANON_KEY=... .
#
# Build context is the REPO ROOT (so both app/ and docker/ are available).
# The Dockerfile lives at docker/Dockerfile and its build context is app/.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/Dockerfile
      - --target
      - runner
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}
      - --build-arg
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - -t
      - ${_IMAGE}
      - app
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
