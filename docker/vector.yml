api:
  enabled: true
  address: 0.0.0.0:9001

sources:
  docker_host:
    type: docker_logs
    exclude_containers:
      - sportai-vector

transforms:
  project_logs:
    type: remap
    inputs:
      - docker_host
    source: |-
      .project = "sportai"
      .container_name = del(.container_name)
      if .container_name == "sportai-db" { .service = "db" }
      else if .container_name == "sportai-auth" { .service = "auth" }
      else if .container_name == "sportai-rest" { .service = "rest" }
      else if .container_name == "sportai-realtime" { .service = "realtime" }
      else if .container_name == "sportai-storage" { .service = "storage" }
      else if .container_name == "sportai-app" { .service = "app" }
      else { .service = "other" }

sinks:
  logflare:
    type: http
    inputs:
      - project_logs
    encoding:
      codec: json
    method: post
    request:
      retry_max_duration_secs: 10
    uri: http://analytics:4000/api/logs?source_name=sportai.logs&api_key=${LOGFLARE_API_KEY}
