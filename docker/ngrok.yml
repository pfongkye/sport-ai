# Ngrok config TEMPLATE for mobile testing — tunnels the app + Supabase.
#
# This file uses ${VARS} that are substituted at runtime from your environment.
# Do NOT run this file directly with ngrok — use the wrapper which renders it:
#
#   ./docker/ngrok-start.sh
#
# The wrapper reads NGROK_AUTHTOKEN and NGROK_SUPABASE_DOMAIN from docker/.env
# (or your shell), renders a temp config, and starts both tunnels.
#
# ── FREE-TIER STRATEGY ───────────────────────────────────────────────────────
# The free plan gives ONE stable "dev domain". Pin it to the SUPABASE tunnel via
# NGROK_SUPABASE_DOMAIN, because that's the tunnel whose callback URL Google must
# whitelist. With Supabase on a stable domain you whitelist Google ONCE and never
# touch it again. The APP tunnel gets a random URL each run (Google doesn't care).
#
# Required env vars:
#   NGROK_AUTHTOKEN        — from https://dashboard.ngrok.com
#   NGROK_SUPABASE_DOMAIN  — your free static domain, e.g. your-name-1234.ngrok-free.app
#                            (claim at https://dashboard.ngrok.com/domains)

version: "3"
agent:
  authtoken: ${NGROK_AUTHTOKEN}

tunnels:
  # App tunnel — random URL each restart (fine, not referenced by Google).
  # request_header.add injects the header that skips ngrok's free-tier browser
  # interstitial, so fetch/POST calls get proxied instead of receiving the
  # warning HTML page. (App fetches also set it via src/lib/api-fetch.ts.)
  app:
    proto: http
    addr: 3000
    request_header:
      add:
        - "ngrok-skip-browser-warning: true"

  # Supabase tunnel — pinned to your stable free domain via env var.
  supabase:
    proto: http
    addr: 8000
    domain: ${NGROK_SUPABASE_DOMAIN}
    request_header:
      add:
        - "ngrok-skip-browser-warning: true"
